# =============================================================================
# datapulse-pipeline: Local Airflow development with Docker Compose
#
# Uses `airflow standalone` — single process, minimal RAM.
# Suitable for t3.micro (1GB RAM) and local dev.
#
# Airflow UI: http://localhost:8080 (admin / auto-generated, see logs)
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # Airflow metadata database (local only — not your RDS)
  # --------------------------------------------------------------------------
  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - datapulse

  # --------------------------------------------------------------------------
  # Airflow standalone: runs scheduler + api-server in one process.
  # Much lighter than separate containers — fits in 1GB RAM.
  # `standalone` is Airflow 3's recommended single-machine mode.
  # --------------------------------------------------------------------------
  airflow:
    image: apache/airflow:3.0.1-python3.12
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "datapulse-local-dev-key-change-in-prod"
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        boto3>=1.42
        psycopg2-binary>=2.9
        requests>=2.33
        great-expectations>=1.16
        python-dotenv>=1.2
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./great_expectations:/opt/airflow/great_expectations
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datapulse

volumes:
  airflow-db-data:
  airflow-logs:

networks:
  datapulse:
    driver: bridge
